<VirtualHost *:80>

    ServerName localhost

    WSGIDaemonProcess flaskapp user=www-data group=www-data threads=5
    WSGIScriptAlias / /app/FlaskApp.wsgi

    <Directory /app>
        WSGIProcessGroup flaskapp
        WSGIApplicationGroup %{GLOBAL}
        # For Apache 2.4
        Require all granted
    </Directory>
    Alias /static /app/src/static
    <Directory /app/src/static/>
        Order allow,deny
        Allow from all
    </Directory>

    ErrorLog /app/error.log
    LogLevel debug
    CustomLog /app/access.log combined

</VirtualHost>
