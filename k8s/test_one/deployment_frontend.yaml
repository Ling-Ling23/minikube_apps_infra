apiVersion: apps/v1
kind: Deployment
metadata:
  name: py3miniapp-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: py3miniapp-frontend
  template:
    metadata:
      labels:
        app: py3miniapp-frontend
    spec:
      containers:
      - name: py3miniapp-frontend
        image: ghcr.io/ling-ling23/py3miniapp:v1
        ports:
        - containerPort: 80
        env:
        - name: PROJECT_DIR
          value: "/app/src"
        - name: PROJECT_GIT_BRANCH
          value: "main"
        - name: PROJECT_GIT_URL
          value: "git@github.com:Ling-Ling23/minikube_apps_infra_app_one.git"