apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: my-app-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    # cert-manager local CA issuer (namespaced Issuer)
    cert-manager.io/issuer: "local-root-ca-issuer"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - myapp.local
    secretName: myapp-local-tls  # Created by cert-manager leaf Certificate
  rules:
  - host: myapp.local
    http:
      paths:
      - path: /app1_backend
        pathType: Prefix
        backend:
          service:
            name: py3miniapp-backend-service
            port:
              number: 5000
      - path: /app1_frontend
        pathType: Prefix
        backend:
          service:
            name: py3miniapp-frontend-service
            port:
              number: 5000
  