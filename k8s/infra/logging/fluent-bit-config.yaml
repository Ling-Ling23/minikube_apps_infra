apiVersion: fluentbit.fluent.io/v1alpha2
kind: FluentBitConfig
metadata:
  name: fluent-bit-config
  namespace: fluent
  labels:
    app.kubernetes.io/name: fluent-bit-config
spec:
  service:
    daemon: false
    flushSeconds: 1
    logLevel: info
    parsersFile: parsers.conf
  inputSelector:
    matchLabels:
      fluentbit.fluent.io/enabled: "true"
  filterSelector:
    matchLabels:
      fluentbit.fluent.io/enabled: "true"
  outputSelector:
    matchLabels:
      fluentbit.fluent.io/enabled: "true"
---
apiVersion: fluentbit.fluent.io/v1alpha2
kind: Input
metadata:
  name: tail
  namespace: fluent
  labels:
    fluentbit.fluent.io/enabled: "true"
spec:
  tail:
    tag: kube.*
    path: /var/log/containers/*.log
    parser: cri
    refreshIntervalSeconds: 10
    memBufLimit: 50MB
    skipLongLines: true
    skipEmptyLines: true
    db: /fluent-bit/tail/pos.db
    dbSync: Normal
---
apiVersion: fluentbit.fluent.io/v1alpha2
kind: Filter
metadata:
  name: kubernetes
  namespace: fluent
  labels:
    fluentbit.fluent.io/enabled: "true"
spec:
  match: kube.*
  filters:
  - kubernetes:
      kubeURL: https://kubernetes.default.svc:443
      kubeCAFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      kubeTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
      labels: true
      annotations: false
      kubeMetaPrefilter:
        k8s-app: true
        app: true
        app.kubernetes.io/name: true
        app.kubernetes.io/instance: true
        app.kubernetes.io/version: true
      mergeLog: true
      mergeLogKey: log_processed
      keepLog: false
---
apiVersion: fluentbit.fluent.io/v1alpha2
kind: Output
metadata:
  name: loki
  namespace: fluent
  labels:
    fluentbit.fluent.io/enabled: "true"
spec:
  match: "*"
  loki:
    host: loki.monitoring.svc.cluster.local
    port: 3100
    labels: job=fluentbit
    labelKeys:
      - kubernetes_container_name
      - kubernetes_pod_name
      - kubernetes_namespace_name
    removeKeys:
      - kubernetes_container_hash
      - kubernetes_docker_id
      - kubernetes_pod_id
    lineFormat: json
    autoKubernetesLabels: true