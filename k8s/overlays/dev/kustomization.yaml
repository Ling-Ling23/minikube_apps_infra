apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: default

# Reference your organized app structure directly
resources:
  - ../../apps/app_one/deployment_backend.yaml
  - ../../apps/app_one/deployment_frontend.yaml  
  - ../../apps/app_one/service_backend.yaml
  - ../../apps/app_one/service_frontend.yaml
  - ../../infra/cert-manager/cluster-issuer.yaml
  - ../../infra/nginx/ingress.yaml

commonLabels:
  environment: dev
  app.kubernetes.io/managed-by: kustomize

# Environment-specific patches
patchesStrategicMerge:
  # Uncomment to override replicas for dev
  # - replica-patch.yaml

# Example JSON patch (uncomment to use):
# patches:
#   - target:
#       kind: Deployment
#       name: py3miniapp-backend
#     patch: |-
#       - op: replace
#         path: /spec/replicas
#         value: 2
