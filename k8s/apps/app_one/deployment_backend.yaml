apiVersion: apps/v1
kind: Deployment
metadata:
  name: py3miniapp-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: py3miniapp-backend
  template:
    metadata:
      labels:
        app: py3miniapp-backend
    spec:
      serviceAccountName: py3miniapp-backend-sa
      # Pod-level security context
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534  # nobody user
        runAsGroup: 65534  # nobody group
        fsGroup: 65534
      containers:
      - name: py3miniapp-backend
        image: ghcr.io/ling-ling23/py3miniapp:v1
        #imagePullPolicy: Always
        # Container-level security context (development-friendly)
        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          readOnlyRootFilesystem: false  # Allow writing for development
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        livenessProbe:
          httpGet:
            path: /live
            port: 80
          initialDelaySeconds: 15
          failureThreshold: 10
          timeoutSeconds: 2
          periodSeconds: 20
        resources:
          requests:
            cpu: "100m" #0.1 cpu - 100 millicores
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        ports:
        - containerPort: 80
        env:
        - name: PROJECT_DIR
          value: "/app/src"
        - name: PROJECT_GIT_BRANCH
          value: "${PROJECT_GIT_BRANCH}"
        - name: PROJECT_GIT_URL
          value: "git@github.com:Ling-Ling23/minikube_apps_infra_app_one.git"
        # No volume mounts needed in development mode